server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Seguridad ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── CORS — permite que ambas plataformas consuman el SDK ──
    # Ajustar los dominios a los reales de producción
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

    # ── Compresión gzip ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Cache de assets estáticos (JS, CSS, imágenes) ─────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Health check endpoint ─────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"worldengine-sdk"}';
        add_header Content-Type application/json;
    }

    # ── SPA fallback — todas las rutas al index.html ──────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── No servir archivos ocultos ────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
